name: Build WezTerm Windows (Patched)

on:
  workflow_dispatch:
    inputs:
      wezterm_version:
        description: 'WezTerm git ref (branch, tag, or commit SHA)'
        required: false
        default: 'main'
        type: string
      patches:
        description: 'Patch URLs / PR links (leave empty to use PATCH_URLS configured in workflow)'
        required: false
        default: ''
        type: string
      tag_name:
        description: 'Release tag name (default: <wezterm_version>-YYYYMMDD-HHMMSS)'
        required: false
        default: ''
        type: string
      release_name:
        description: 'Release title'
        required: false
        default: 'Custom WezTerm Windows Portable Build'
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean
      run_tests:
        description: 'Run cargo test before packaging'
        required: false
        default: false
        type: boolean

  schedule:
    # 每月 1 号 00:00 UTC 自动运行构建
    - cron: '0 0 1 * *'

  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'patches/**'

env:
  # =========================================================================
  # 在这里配置你需要打上的 PR 或补丁链接列表（支持 PR 页面、commit 或 patch URL）
  # 每次仅需修改此处的链接列表即可，CI 会在构建时自动拉取 PR 的 patch 并打上
  # 支持格式：
  #   https://github.com/wezterm/wezterm/pull/7542/changes
  #   https://github.com/wezterm/wezterm/pull/7542
  #   https://github.com/wezterm/wezterm/commit/<commit-hash>
  #   https://example.com/custom.patch
  # =========================================================================
  PATCH_URLS: |
    https://github.com/wezterm/wezterm/pull/7542/changes

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      wezterm_version: ${{ steps.set_version.outputs.wezterm_version }}
      tag_name: ${{ steps.set_tag.outputs.tag_name }}
      release_name: ${{ steps.set_release_name.outputs.release_name }}
      patches: ${{ steps.set_patches.outputs.patches }}
      prerelease: ${{ steps.set_prerelease.outputs.prerelease }}
    steps:
      - name: Set WezTerm version
        id: set_version
        run: |
          INPUT_VERSION="${{ github.event.inputs.wezterm_version }}"
          if [ -n "$INPUT_VERSION" ] && [ "$INPUT_VERSION" != "latest" ]; then
            echo "wezterm_version=${INPUT_VERSION}" >> $GITHUB_OUTPUT
          elif [ "$INPUT_VERSION" = "latest" ]; then
            LATEST_TAG=$(curl -fsSL https://api.github.com/repos/wezterm/wezterm/releases/latest | jq -r .tag_name 2>/dev/null || echo "")
            if [ -n "$LATEST_TAG" ] && [ "$LATEST_TAG" != "null" ]; then
              echo "wezterm_version=${LATEST_TAG}" >> $GITHUB_OUTPUT
            else
              echo "wezterm_version=main" >> $GITHUB_OUTPUT
            fi
          else
            # 默认 main 分支
            echo "wezterm_version=main" >> $GITHUB_OUTPUT
          fi

      - name: Set tag name
        id: set_tag
        run: |
          INPUT_TAG="${{ github.event.inputs.tag_name }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG_NAME="$INPUT_TAG"
          else
            TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
            VER="${{ steps.set_version.outputs.wezterm_version }}"
            TAG_NAME="${VER}-${TIMESTAMP}"
          fi
          # Sanitize tag name
          TAG_NAME=$(echo "$TAG_NAME" | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Set release name
        id: set_release_name
        run: |
          INPUT_NAME="${{ github.event.inputs.release_name }}"
          if [ -n "$INPUT_NAME" ]; then
            echo "release_name=${INPUT_NAME}" >> $GITHUB_OUTPUT
          else
            echo "release_name=Custom WezTerm Windows Portable Build" >> $GITHUB_OUTPUT
          fi

      - name: Set patches
        id: set_patches
        run: |
          INPUT_PATCHES="${{ github.event.inputs.patches }}"
          if [ -z "$INPUT_PATCHES" ]; then
            INPUT_PATCHES="${{ env.PATCH_URLS }}"
          fi
          echo "patches<<EOF" >> $GITHUB_OUTPUT
          echo "$INPUT_PATCHES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Set prerelease
        id: set_prerelease
        run: |
          echo "prerelease=${{ github.event.inputs.prerelease || 'false' }}" >> $GITHUB_OUTPUT

  build:
    needs: prepare
    runs-on: windows-2025
    permissions:
      contents: read
      actions: write
    env:
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      RUSTUP_WINDOWS_PATH_ADD_BIN: "1"
      TAG_NAME: ${{ needs.prepare.outputs.tag_name }}

    steps:
      - name: Checkout WezTerm
        uses: actions/checkout@v4
        with:
          repository: 'wezterm/wezterm'
          ref: ${{ needs.prepare.outputs.wezterm_version }}
          submodules: 'recursive'
          fetch-depth: 0
          autocrlf: false

      - name: Checkout Repository (for optional local patches)
        uses: actions/checkout@v4
        with:
          path: _builder

      - name: Setup Tools (Strawberry Perl)
        shell: pwsh
        run: |
          if (Test-Path "C:\Strawberry\perl\bin") {
            Add-Content $env:GITHUB_PATH "C:\Strawberry\perl\bin"
            Write-Host "Added Strawberry Perl to PATH"
          }

      - name: Set WezTerm Version Tag
        shell: bash
        run: |
          echo "${{ needs.prepare.outputs.tag_name }}" > .tag
          mkdir -p wezterm-gui
          echo "${{ needs.prepare.outputs.tag_name }}" > wezterm-gui/.tag
          echo "Configured WezTerm build version tag: ${{ needs.prepare.outputs.tag_name }}"

      - name: Fetch and Apply Patches
        shell: bash
        env:
          PATCHES: ${{ needs.prepare.outputs.patches }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          apply_patch_file() {
            local file="$1"
            echo "--> Processing patch: $file"
            if git apply --check --ignore-whitespace "$file" 2>/dev/null; then
              echo "Applying $file..."
              git apply --verbose --ignore-whitespace "$file"
            elif git apply --reverse --check --ignore-whitespace "$file" 2>/dev/null; then
              echo "Patch $file is already applied or merged upstream, skipping."
            else
              echo "Standard check failed, attempting 3-way merge apply..."
              git apply --verbose --ignore-whitespace -3 "$file"
            fi
          }

          # 1. 可选的本地 patch：检查仓库 patches/ 目录是否存在本地 patch 文件
          if [ -d "_builder/patches" ]; then
            for p in _builder/patches/*.patch _builder/patches/*.diff; do
              [ -f "$p" ] || continue
              echo "Found optional local patch: $p"
              apply_patch_file "$p"
            done
          fi

          # 2. 从 PR 链接/URL 自动获取并应用补丁
          mkdir -p _downloaded_patches
          idx=0
          while IFS= read -r line || [ -n "$line" ]; do
            raw=$(echo "$line" | xargs)
            [ -z "$raw" ] && continue
            [[ "$raw" == \#* ]] && continue

            idx=$((idx + 1))
            target_url="$raw"

            # 自动将 PR 页面链接 (/pull/7542/changes, /files, /pull/7542) 转换为 .patch 补丁地址
            if [[ "$target_url" =~ https?://github\.com/[^/]+/[^/]+/pull/[0-9]+ ]]; then
              base_pr=$(echo "$target_url" | grep -oE 'https?://github\.com/[^/]+/[^/]+/pull/[0-9]+')
              target_url="${base_pr}.patch"
            elif [[ "$target_url" =~ https?://github\.com/[^/]+/[^/]+/commit/[0-9a-fA-F]+ ]] && [[ ! "$target_url" =~ \.patch$ ]]; then
              target_url="${target_url}.patch"
            fi

            patch_path="_downloaded_patches/patch_${idx}.patch"
            echo "Fetching patch #$idx from: $target_url"
            curl -fsSL "$target_url" -o "$patch_path"
            apply_patch_file "$patch_path"
          done <<< "$PATCHES"

          echo "===> All patches applied. Working tree status:"
          git status --short
          git commit -am "Apply custom patches" --allow-empty

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc

      - name: Compile with sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache Rust Dependencies
        uses: actions/cache@v4
        id: cache-cargo-vendor
        with:
          path: |
            vendor
            .cargo/config.toml
          key: cargo-deps-${{ hashFiles('**/Cargo.lock') }}

      - name: Vendor dependencies
        if: steps.cache-cargo-vendor.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cargo vendor --locked --versioned-dirs >> .cargo/config.toml 2>/dev/null || cargo vendor --versioned-dirs >> .cargo/config.toml

      - name: Zero sccache statistics
        shell: bash
        run: sccache --zero-stats || true

      - name: Build wezterm (Release mode)
        shell: cmd
        run: cargo build -p wezterm --release

      - name: Build wezterm-gui (Release mode)
        shell: cmd
        run: cargo build -p wezterm-gui --release

      - name: Build wezterm-mux-server (Release mode)
        shell: cmd
        run: cargo build -p wezterm-mux-server --release

      - name: Build strip-ansi-escapes (Release mode)
        shell: cmd
        run: cargo build -p strip-ansi-escapes --release

      - name: Show sccache statistics
        shell: bash
        run: sccache --show-stats || true

      - name: Run Tests (Optional)
        if: ${{ github.event.inputs.run_tests == 'true' }}
        shell: cmd
        run: cargo test --workspace --no-fail-fast

      - name: Package Portable Zip
        shell: bash
        run: |
          zipdir="WezTerm-windows-${TAG_NAME}"
          zipname="${zipdir}.zip"
          echo "Packaging portable zip: $zipname"

          rm -rf "$zipdir" "$zipname"
          mkdir -p "$zipdir"

          # Copy binaries
          cp target/release/wezterm.exe \
             target/release/wezterm-gui.exe \
             target/release/wezterm-mux-server.exe \
             target/release/strip-ansi-escapes.exe \
             "$zipdir/"

          # Copy license for compliance
          [ -f LICENSE.md ] && cp LICENSE.md "$zipdir/" || true

          # Copy debug pdb if present
          [ -f target/release/wezterm.pdb ] && cp target/release/wezterm.pdb "$zipdir/" || true

          # Copy runtime DLLs and helper binaries
          cp assets/windows/conhost/conpty.dll \
             assets/windows/conhost/OpenConsole.exe \
             assets/windows/angle/libEGL.dll \
             assets/windows/angle/libGLESv2.dll \
             "$zipdir/"

          # Copy Mesa OpenGL fallback
          mkdir -p "$zipdir/mesa"
          cp target/release/mesa/opengl32.dll "$zipdir/mesa/"

          # Compress to zip
          7z a -tzip "$zipname" "$zipdir"
          echo "Portable package ready: $zipname"

      - name: Generate SHA256 Checksums
        shell: bash
        run: |
          for f in WezTerm-*.zip; do
            if [ -f "$f" ]; then
              echo "Hashing $f..."
              sha256sum "$f" > "$f.sha256"
            fi
          done
          ls -lh WezTerm-*

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wezterm-windows-portable
          path: |
            WezTerm-*.zip
            WezTerm-*.sha256
          retention-days: 7

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: wezterm-windows-portable
          path: release-assets

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
          RELEASE_NAME: ${{ needs.prepare.outputs.release_name }}
          WEZTERM_VERSION: ${{ needs.prepare.outputs.wezterm_version }}
          PATCH_LIST: ${{ needs.prepare.outputs.patches }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          cat << 'EOF' > release_notes.md
          ## WezTerm Windows Portable Build (Patched)

          Automated build of [WezTerm](https://github.com/wezterm/wezterm) for Windows (Portable Edition) with custom patches applied.

          ### Build Information
          - **WezTerm Upstream Ref**: `${{ env.WEZTERM_VERSION }}`
          - **Release Tag**: `${{ env.TAG_NAME }}`
          - **Target Platform**: Windows x86_64 (`x86_64-pc-windows-msvc`)
          - **Package Type**: Portable Standalone Zip

          ### Applied Patches
          EOF

          if [ -n "$PATCH_LIST" ]; then
            while IFS= read -r patch; do
              p=$(echo "$patch" | xargs)
              [ -z "$p" ] && continue
              echo "- $p" >> release_notes.md
            done <<< "$PATCH_LIST"
          else
            echo "- None (standard upstream build)" >> release_notes.md
          fi

          cat << 'EOF' >> release_notes.md

          ### Checksums (SHA256)
          ```
          EOF

          cd release-assets
          for f in *.sha256; do
            if [ -f "$f" ]; then
              cat "$f" >> ../release_notes.md
            fi
          done
          cd ..

          cat << 'EOF' >> release_notes.md
          ```

          ### Included Files
          - **Portable Zip** (`WezTerm-windows-*.zip`): Portable archive containing `wezterm.exe`, `wezterm-gui.exe`, `wezterm-mux-server.exe`, and required runtime DLLs (ANGLE, ConPTY, Mesa).
          EOF

          EXTRA_ARGS=()
          if [ "$IS_PRERELEASE" = "true" ]; then
            EXTRA_ARGS+=("--prerelease")
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists, updating assets..."
            gh release upload "$TAG_NAME" release-assets/* --clobber
            gh release edit "$TAG_NAME" --title "$RELEASE_NAME ($TAG_NAME)" --notes-file release_notes.md "${EXTRA_ARGS[@]}"
          else
            echo "Creating new release $TAG_NAME..."
            gh release create "$TAG_NAME" \
              release-assets/* \
              --title "$RELEASE_NAME ($TAG_NAME)" \
              --notes-file release_notes.md \
              "${EXTRA_ARGS[@]}"
          fi
